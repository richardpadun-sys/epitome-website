<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon: the avatar lockup on a gradient ground. Rise · 45° with the
    midpoint held at 55%, since the tile is square. The mark is flat white on
    top of it — the gradient does one job at a time.
  -->
  <defs>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B23E8"/>
      <stop offset="55%" stop-color="#8B27C4"/>
      <stop offset="100%" stop-color="#D42A8E"/>
    </linearGradient>
    <mask id="summit" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="black"/>
      <path d="M6 58 H58 V6 Z" fill="white"/>
      <path d="M10 66 L28 48 L36 56 L52 40" fill="none" stroke="black"
            stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#rise)"/>
  <g transform="translate(32 32) scale(0.66) translate(-32 -32)">
    <rect width="64" height="64" fill="#ffffff" mask="url(#summit)"/>
  </g>
</svg>
